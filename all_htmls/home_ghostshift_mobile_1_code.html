<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid #f1f5f9;
        }
        
        /* Custom scrollbar for horizontal scrolling */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .animated-gradient {
            background: linear-gradient(120deg, #f8f9ff 0%, #eaf1ff 50%, #f8f9ff 100%);
            background-size: 200% 200%;
            animation: gradientMove 8s ease infinite;
        }
        
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-md antialiased md:hidden animated-gradient min-h-screen pb-24">
<!-- Top Header -->
<header class="flex justify-between items-center px-md pt-lg pb-md">
<div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Welcome back, Sarah</h1>
<p class="font-body-md text-body-md text-secondary mt-xs">Ready for your next shift?</p>
</div>
<div class="relative">
<img class="w-[48px] h-[48px] rounded-full object-cover border-2 border-surface-container-high shadow-sm" data-alt="A professional headshot of a female nurse in her 30s with dark hair tied back, wearing light blue scrubs. The lighting is soft and studio-quality, emphasizing a competent and friendly demeanor. The background is a slightly blurred, clean clinical setting to provide context while keeping the focus on her face." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB_fZklEt6fd8opB9zA1tnpw6Jaro--UDmEpRuwHy0GOv6QEYil0NFhvvzuqanTeADM8QhzQEevKisvjrBcUTyXw9Tyr2_EYNONsSVv8qJ9TGLbIKVMnpBOB4SrvTd2D5k-As4nCu76KVfgyd4EtD1JQ4Q9aaIEKvnH6HJumRuK6OpmtoYj263Il34aws0XlSByeyslIgrB3p8KOe8_oXIOKVUrwQyPzv3280iJlI2O8Y19WqbQ9hE3jA1lxPf1K3dDFdaO4yInwes"/>
<span class="absolute bottom-0 right-0 w-3 h-3 bg-[#10b981] border-2 border-surface-container-lowest rounded-full"></span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="px-md flex flex-col gap-md">
<!-- Next Shift Card (Bento Style) -->
<section class="glass-card rounded-xl p-md shadow-[0px_10px_15px_-3px_rgba(0,0,0,0.05)] relative overflow-hidden">
<!-- Accent glow -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-primary-container opacity-20 rounded-full blur-2xl"></div>
<div class="flex justify-between items-start mb-md relative z-10">
<div>
<div class="flex items-center gap-xs mb-xs">
<span class="material-symbols-outlined text-primary text-[18px]">calendar_month</span>
<span class="font-label-md text-label-md text-primary font-bold tracking-widest uppercase">Next Shift</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface">ICU Ward B</h2>
<p class="font-body-sm text-body-sm text-secondary">Today, 07:00 - 19:00</p>
</div>
<div class="bg-surface-container-low px-sm py-xs rounded-lg border border-surface-variant flex flex-col items-center">
<span class="font-label-sm text-label-sm text-secondary uppercase">Starts In</span>
<span class="font-headline-md text-headline-md text-on-surface">1h 15m</span>
</div>
</div>
<div class="flex gap-sm relative z-10">
<button class="flex-1 bg-primary text-on-primary font-label-md text-label-md py-sm rounded-lg flex items-center justify-center gap-xs shadow-sm hover:opacity-90 transition-opacity">
<span class="material-symbols-outlined text-[18px]">check_circle</span>
                    Check In
                </button>
<button class="w-[44px] h-[44px] bg-surface-container-lowest border border-outline-variant rounded-lg flex items-center justify-center text-secondary hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-[20px]">more_horiz</span>
</button>
</div>
</section>
<!-- Health Meter / Burnout Indicator -->
<section class="glass-card rounded-xl p-md border-l-4 border-l-primary shadow-[0px_10px_15px_-3px_rgba(0,0,0,0.05)]">
<div class="flex justify-between items-center mb-sm">
<h3 class="font-label-md text-label-md text-on-surface">Health &amp; Balance</h3>
<span class="bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm px-xs py-[2px] rounded">Optimal</span>
</div>
<div class="flex items-end gap-sm mb-sm">
<span class="font-display-lg text-display-lg text-primary leading-none">92<span class="text-headline-md font-normal">%</span></span>
</div>
<!-- Progress Bar -->
<div class="w-full bg-surface-variant rounded-full h-2 mb-xs overflow-hidden">
<div class="bg-primary h-2 rounded-full" style="width: 92%"></div>
</div>
<p class="font-body-sm text-body-sm text-secondary">You are well-rested. No high burnout risk detected.</p>
</section>
<!-- Weekly Overview Strip -->
<section class="mt-xs">
<div class="flex justify-between items-center mb-sm">
<h3 class="font-label-md text-label-md text-on-surface">This Week</h3>
<button class="font-label-sm text-label-sm text-primary flex items-center gap-[2px]">
                    View all <span class="material-symbols-outlined text-[14px]">arrow_forward</span>
</button>
</div>
<div class="flex gap-sm overflow-x-auto hide-scrollbar pb-xs">
<!-- Day 1 (Past) -->
<div class="flex-shrink-0 w-[64px] bg-surface-container-lowest border border-outline-variant/30 rounded-lg py-sm flex flex-col items-center opacity-70">
<span class="font-label-sm text-label-sm text-secondary uppercase">Mon</span>
<span class="font-headline-md text-headline-md text-on-surface mt-xs">12</span>
<div class="w-1.5 h-1.5 rounded-full bg-surface-variant mt-xs"></div>
</div>
<!-- Day 2 (Active/Today) -->
<div class="flex-shrink-0 w-[64px] bg-primary text-on-primary rounded-lg py-sm flex flex-col items-center shadow-md relative">
<span class="font-label-sm text-label-sm text-on-primary uppercase">Tue</span>
<span class="font-headline-md text-headline-md text-on-primary mt-xs">13</span>
<div class="w-1.5 h-1.5 rounded-full bg-on-primary mt-xs"></div>
<span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-error rounded-full border border-surface-container-lowest animate-pulse"></span>
</div>
<!-- Day 3 (Future Shift) -->
<div class="flex-shrink-0 w-[64px] bg-surface-container-lowest border border-outline-variant/30 rounded-lg py-sm flex flex-col items-center">
<span class="font-label-sm text-label-sm text-secondary uppercase">Wed</span>
<span class="font-headline-md text-headline-md text-on-surface mt-xs">14</span>
<div class="w-1.5 h-1.5 rounded-full bg-primary mt-xs"></div>
</div>
<!-- Day 4 (Off) -->
<div class="flex-shrink-0 w-[64px] bg-surface-container-lowest border border-outline-variant/30 rounded-lg py-sm flex flex-col items-center">
<span class="font-label-sm text-label-sm text-secondary uppercase">Thu</span>
<span class="font-headline-md text-headline-md text-on-surface mt-xs">15</span>
<div class="w-1.5 h-1.5 rounded-full bg-transparent mt-xs border border-outline-variant/50"></div>
</div>
<!-- Day 5 (Future Shift) -->
<div class="flex-shrink-0 w-[64px] bg-surface-container-lowest border border-outline-variant/30 rounded-lg py-sm flex flex-col items-center">
<span class="font-label-sm text-label-sm text-secondary uppercase">Fri</span>
<span class="font-headline-md text-headline-md text-on-surface mt-xs">16</span>
<div class="w-1.5 h-1.5 rounded-full bg-primary mt-xs"></div>
</div>
</div>
</section>
</main>
<!-- Bottom Navigation Bar (Synthesized from constraints, typical mobile pattern) -->
<nav class="fixed bottom-0 left-0 w-full glass-card border-t border-surface-variant/20 flex justify-around items-center h-[72px] pb-2 px-md z-50">
<!-- Active Tab: Dashboard/Home equivalent -->
<button class="flex flex-col items-center justify-center w-16 h-full gap-1">
<div class="w-12 h-8 rounded-full bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary" style="font-variation-settings: 'FILL' 1;">grid_view</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface">Home</span>
</button>
<button class="flex flex-col items-center justify-center w-16 h-full gap-1 text-on-surface-variant hover:text-primary transition-colors">
<div class="w-12 h-8 rounded-full flex items-center justify-center hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined">calendar_today</span>
</div>
<span class="font-label-sm text-label-sm">Schedules</span>
</button>
<button class="flex flex-col items-center justify-center w-16 h-full gap-1 text-on-surface-variant hover:text-primary transition-colors">
<div class="w-12 h-8 rounded-full flex items-center justify-center hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined">person</span>
</div>
<span class="font-label-sm text-label-sm">Profile</span>
</button>
</nav>
</body></html>
